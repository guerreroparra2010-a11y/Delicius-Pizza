<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delicius Pizza – Sitio Único</title>
    <link rel="icon" href="imagen/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin:0; font-family:'Outfit',sans-serif; background:#111; color:#eee;
        }
        nav {
            position:fixed; top:0; left:0; right:0; background:rgba(20,20,20,0.9); display:flex; justify-content:center; gap:1rem; padding:0.8rem 0; z-index:10; backdrop-filter:blur(8px);
        }
        nav a { color:#fff; text-decoration:none; font-weight:600; padding:0.4rem 0.8rem; border-radius:4px; transition:background 0.2s; }
        nav a:hover { background:rgba(255,255,255,0.1); }
        section { padding-top:60px; margin-top:60px; }
        .frame {
            width:100%; height:80vh; border:none; border-top:2px solid #333; }
        .section-title { text-align:center; font-size:2rem; margin:1rem 0; color:#ffda79; }
    
        @media (min-width: 993px) {
            nav {
                top: 0; left: 0; width: 260px; height: 100vh;
                flex-direction: column; justify-content: flex-start;
                padding-top: 4rem; border-right: 1px solid rgba(255, 179, 0, 0.2);
            }
            body { padding-left: 260px; }
            section { margin-top: 0; padding-top: 20px; }
        }
    
    </style>
</head>
<body>
    <nav>
        <a href="#intro">Intro</a>
        <a href="#nosotros">Nosotros</a>
        <a href="#menu">Menú</a>
        <a href="#pizzas">Pizzas</a>
        <a href="#pedido">Pedido</a>
        <a href="#resenas">Reseñas</a>
    </nav>

    <section id="intro">
        <h2 class="section-title">Bienvenidos</h2>
        <!-- Re‑use the original intro page via iframe -->
        <iframe class="frame" src="html/index.html"></iframe>
    </section>
    <section id="nosotros">
        <h2 class="section-title">Sobre Nosotros</h2>
        <iframe class="frame" src="html/nosotros.html"></iframe>
    </section>
    <section id="menu">
        <h2 class="section-title">Nuestro Menú</h2>
        <iframe class="frame" src="html/menu.html"></iframe>
    </section>
    <section id="pizzas">
        <h2 class="section-title">Pizzas</h2>
        <iframe class="frame" src="html/pizzas.html"></iframe>
    </section>
    <section id="pedido">
        <h2 class="section-title">Pedido a Encargo</h2>
        <iframe class="frame" src="html/pedidoencargo.html"></iframe>
    </section>
    <section id="resenas">
        <h2 class="section-title">Reseñas</h2>
        <iframe class="frame" src="html/resenas.html"></iframe>
    </section>
</body>
</html>
